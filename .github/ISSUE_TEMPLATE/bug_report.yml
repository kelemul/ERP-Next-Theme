name: Bug Report
description: Report a problem with HeliosDesk
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.

  - type: input
    id: frappe-version
    attributes:
      label: Frappe Version
      description: Output of `bench version`
      placeholder: e.g. v15.93.0
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: HeliosDesk Version
      description: Found in "About" or `App Versions`
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 120, Windows 11

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened vs what you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Error appears

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Browser console errors, frappe.log, screenshots
