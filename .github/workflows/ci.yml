name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check helios_desk/ --ignore=E501,F401

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check CSS/JS structure
        run: |
          echo "=== CSS files ==="
          ls helios_desk/public/css/
          echo "=== JS files ==="
          ls helios_desk/public/js/
